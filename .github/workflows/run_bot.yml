name: Bot Pemantau Saham

on:
  # Mengatur jadwal otomatis (Cron Job)
  # Contoh di bawah berjalan setiap 4 sekali dari Senin sampai Jumat
  schedule:
    - cron: '0 */4 * * 1-5'
  
  # Memungkinkan Anda menjalankan bot secara manual dari tab Actions di GitHub kapan saja
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python market_alert.py